name: CRYPTO-ORACLE Z Tests

on:
  push:
    branches:
      - crypto-oracle-z
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile scanner
        run: python -m py_compile crypto_oracle_scanner.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
