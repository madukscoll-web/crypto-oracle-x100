name: CRYPTO-ORACLE Z Tests

on:
  push:
    branches:
      - main
      - crypto-oracle-z
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile scanner
        run: python -m compileall -q *.py tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Probe bounded public evidence adapters without secrets or notifications
        timeout-minutes: 5
        run: |
          python -u hourly_evidence_probe.py
          python -u news_context.py
          python -u strategy_lab_probe.py
      - name: Retain public adapter integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-adapter-probe-${{ github.run_id }}
          path: |
            work/hourly_evidence_probe.json
            news_source_report.json
            work/strategy_lab_probe.json
            work/strategy_lab_probe_sources.json
          retention-days: 7
          if-no-files-found: warn



