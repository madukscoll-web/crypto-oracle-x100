name: Global discovery and Gate Spot research (read-only)

on:
  workflow_dispatch:
    inputs:
      assessment_limit:
        description: Bounded canonical-token assessments across four chains
        type: choice
        options: ['4', '8', '12']
        default: '8'

permissions:
  contents: read

concurrency:
  group: global-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all security and discovery regressions
        run: |
          python -m compileall -q *.py tests
          python -m unittest discover -s tests -v
      - name: Collect public evidence without notification or state writes
        env:
          ASSESSMENT_LIMIT: ${{ inputs.assessment_limit }}
        run: python global_discovery.py --limit "$ASSESSMENT_LIMIT" --output global_discovery_report.json.gz
      - name: Upload timestamped evidence and unsent alert previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-discovery-gate-spot-research
          path: global_discovery_report*
          if-no-files-found: warn
