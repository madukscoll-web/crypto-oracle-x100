name: Multichain read-only research

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read

concurrency:
  group: multichain-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test
        run: |
          python -m compileall -q *.py tests
          python -m unittest discover -s tests -v
      - name: Run read-only discovery
        run: python multichain_live_research.py --limit 12
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multichain-research-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: multichain_research_report.json
