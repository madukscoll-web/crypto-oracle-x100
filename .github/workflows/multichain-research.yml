name: Multichain read-only research

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read

concurrency:
  group: multichain-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test
        run: |
          python -m compileall -q *.py tests
          python -m unittest discover -s tests -v
      - name: Run read-only discovery
        run: python multichain_live_research.py --limit 12
      - name: Verify fail-closed research audit
        run: |
          python - <<'PY'
          import json
          with open('multichain_research_report.json', encoding='utf-8') as source:
              report = json.load(source)
          audit = report['coverage_audit']
          assert audit['scope'] == 'DISCOVERY_ONLY'
          assert audit['selected_total'] == len(report['selected'])
          assert audit['verified_buy_count'] == 0
          assert audit['buy_authorized'] is False
          assert audit['telegram_eligible'] is False
          assert report['orders_allowed'] is False
          print('Discovery-only evidence audit verified')
          PY
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multichain-research-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: multichain_research_report.json
