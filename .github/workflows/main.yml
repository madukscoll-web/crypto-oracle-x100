name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Multichain read-only research', 'Gate catalog-first live discovery (research only)']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
      - stonk_launch_discovery.py
      - multichain_live_research.py
      - canonical_outcomes.py
      - research_state.py
      - forward_ledger.py
      - workflow_state.py
      - launchpad_discovery.py
      - research_validation.py
      - tests/test_multichain_live_research.py
      - multichain_research_audit.py
      - crypto_oracle_scanner.py
      - authenticated_admission.py
      - admission_feed.py
      - admission_preflight.py
      - admission_trust.json
      - admission_evidence/**
      - adverse_evidence.py
      - sequential_simulation.py
      - technical_followup.py
      - strategy_lab.py
      - strategy_lab_runner.py
      - strategy_lab_policy.json
      - pipeline_health.py
      - scanner_cadence.py
      - hourly_evidence.py
      - scan_audit.py
      - telegram_notify.py
      - altcoin_reversal_*.py
      - reversal_universe.py
      - technical_watch.py
      - project_context.py
      - news_context.py
      - project_context_assets.json
      - fundamental_evidence.py
      - technical_watch_policy.json
      - evidence_coverage.py
      - solana_evidence.py
      - verification.py
      - provider_session.py
      - execution_quotes.py
      - kyber_quotes.py
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-oracle-hourly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh latest state for cadence guard
        id: cadence_refresh
        run: python workflow_state.py refresh
      - name: Check actual scanner cadence
        id: cadence
        run: python scanner_cadence.py guard
      - name: Check Python source compilation
        if: success() && steps.cadence.outputs.run == 'true'
        id: compile
        run: python -m compileall -q *.py tests
      - name: Run scanner unit tests
        if: success() && steps.cadence.outputs.run == 'true'
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Check Telegram configuration
        if: success() && steps.cadence.outputs.run == 'true'
        id: telegram_config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYTHON'
          import os
          import sys
          missing = [key for key in ('TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID') if not os.environ.get(key, '').strip()]
          if missing:
              print('::error::Missing required GitHub Secrets: ' + ', '.join(missing))
              sys.exit(1)
          print('Required Telegram secrets are configured (values withheld).')
          PYTHON
      - name: Refresh persisted scanner state
        id: state_refresh
        if: success() && steps.cadence.outputs.run == 'true'
        run: python workflow_state.py refresh
      - name: Run scanner
        if: success() && steps.cadence.outputs.run == 'true'
        id: scan
        timeout-minutes: 15
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ORACLE_TAKER_ADDRESS: ${{ vars.ORACLE_TAKER_ADDRESS || secrets.ORACLE_TAKER_ADDRESS }}
          ORACLE_FUNDING_TOKEN: ${{ vars.ORACLE_FUNDING_TOKEN || secrets.ORACLE_FUNDING_TOKEN }}
          ORACLE_ORDER_BASE_UNITS: ${{ vars.ORACLE_ORDER_BASE_UNITS || secrets.ORACLE_ORDER_BASE_UNITS }}
        run: |
          python -c 'import json, os; from execution_configuration import status; print(json.dumps(status(os.environ)))'
          python admission_preflight.py
          python scanner_cadence.py start
          python -u crypto_oracle_scanner.py
      - name: Run bounded multichain discovery audit
        if: success() && steps.cadence.outputs.run == 'true'
        id: multichain
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -u multichain_live_research.py --limit 12 --include-profiles --include-stonk --include-launchpads --state research_discovery_state.json --output multichain_research_report.json
          python - <<'PY'
          import json
          with open('multichain_research_report.json', encoding='utf-8') as source:
              report = json.load(source)
          audit = report['coverage_audit']
          assert audit['scope'] == 'DISCOVERY_ONLY'
          assert audit['selected_total'] == len(report['selected'])
          assert audit['verified_buy_count'] == 0
          assert audit['buy_authorized'] is False
          assert audit['telegram_eligible'] is False
          assert report['orders_allowed'] is False
          print('Read-only multichain coverage:', json.dumps(audit, sort_keys=True))
          PY
      - name: Run bounded altcoin bullish-reversal research
        if: success() && steps.cadence.outputs.run == 'true'
        id: reversal
        continue-on-error: true
        timeout-minutes: 4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u altcoin_reversal_production.py
      - name: Evaluate fixed strategies and advance prospective paper accounts
        id: strategy_lab
        if: success() && steps.cadence.outputs.run == 'true' && steps.reversal.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: python -u strategy_lab_runner.py
      - name: Sample delivered technical hypotheses prospectively
        id: technical_followup
        if: success() && steps.cadence.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: python -u technical_followup.py
      - name: Run read-only StonkFun launch audit
        if: success() && steps.cadence.outputs.run == 'true'
        id: stonk_launches
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import json
          from stonk_launch_discovery import run
          result = run()
          assert result["mode"] == "READ_ONLY_RESEARCH"
          assert result["orders_allowed"] is False
          assert result["buy_authorized"] is False
          assert result["telegram_transmission"] is False
          with open("stonk_launch_report.json", "w", encoding="utf-8") as output:
              json.dump(result, output, indent=2)
          print("StonkFun read-only launches:", result["count"], "invalid:", result["invalid_rows"])
          PY
      - name: Record historical research validation status
        if: success() && steps.cadence.outputs.run == 'true'
        run: python research_validation.py --dataset historical_cohort.json --output historical_validation_report.json
      - name: Record Gate review backlog diagnostics
        if: always() && steps.cadence.outputs.run == 'true'
        run: python gate_review_backlog.py --output gate_review_backlog.json
      - name: Report research stage health
        id: research_health
        if: always() && steps.cadence.outputs.run == 'true'
        env:
          RESEARCH_STAGE_OUTCOMES: '{"scan":"${{ steps.scan.outcome }}","multichain":"${{ steps.multichain.outcome }}","reversal":"${{ steps.reversal.outcome }}","technical_followup":"${{ steps.technical_followup.outcome }}","strategy_lab":"${{ steps.strategy_lab.outcome }}","stonk_launches":"${{ steps.stonk_launches.outcome }}"}'
        run: python pipeline_health.py
      - name: Send daily pipeline health digest
        id: operational_summary
        if: success() && steps.cadence.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py success
      - name: Record actual core scan outcome
        if: always() && steps.cadence.outputs.run == 'true' && steps.scan.outcome != 'skipped'
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python scanner_cadence.py finish
      - name: Save scanner state
        id: state
        if: always() && steps.scan.outcome != 'skipped' && steps.cadence.outputs.run == 'true'
        run: python workflow_state.py publish
      - name: Notify Telegram when workflow fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED_STAGES: cadence_refresh=${{ steps.cadence_refresh.outcome }}, cadence=${{ steps.cadence.outcome }}, compile=${{ steps.compile.outcome }}, tests=${{ steps.tests.outcome }}, config=${{ steps.telegram_config.outcome }}, state_refresh=${{ steps.state_refresh.outcome }}, scan=${{ steps.scan.outcome }}, state=${{ steps.state.outcome }}, research_health=${{ steps.research_health.outcome }}
        run: python telegram_notify.py failure
      - name: Retain scan diagnostics and state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            historical_validation_report.json
            forward_events.jsonl
            workflow_state_base.json
            state_publish_report.json
            research_discovery_state.json
            stonk_launch_report.json
            multichain_research_report.json
            work/admission_preflight.json
            scanner_cadence_report.json
            scanner_runtime_state.json
            scan_summary.json
            operational_notification.json
            operational_digest_state.json
            altcoin_reversal_report.json
            reversal_universe_state.json
            technical_watch_state.json
            technical_watch_delivery.json
            technical_followup_state.json
            technical_followup_report.json
            strategy_lab_state.json
            strategy_lab_report.json
            pipeline_health_report.json
            strategy_lab_policy.json
            project_context_cache.json
            evidence_report.json
            gate_candidate_report.json
            gate_review_backlog.json
            gate_paper_history.json
            reported_pools.json
            watchlist_state.json
            signal_history.json




