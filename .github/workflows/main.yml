

name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:
    schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  scanner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check scanner syntax
        run: python -m py_compile crypto_oracle_scanner.py

      - name: Send Telegram test alert
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          if not token or not chat_id:
              raise RuntimeError("Telegram secrets missing")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": (
                  "CRYPTO-ORACLE X100\n"
                  "Telegram connection successful!\n"
                  "GitHub Actions alerts are working."
              )
          }).encode()

          request = urllib.request.Request(
              url, data=data, method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise RuntimeError("Telegram message rejected")

          print("Telegram notification sent successfully")
          PY
