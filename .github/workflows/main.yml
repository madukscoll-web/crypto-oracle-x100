name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-oracle-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate scanner and signal rules
        run: |
          python -m compileall -q crypto_oracle_scanner.py signal_tracker.py evidence_audit.py market_corroboration.py valuation_scenarios.py verification.py execution_quotes.py tests
          python -m unittest discover -s tests -v
      - name: Run scanner
        env:
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ORACLE_TAKER_ADDRESS: ${{ vars.ORACLE_TAKER_ADDRESS }}
          ORACLE_FUNDING_TOKEN: ${{ vars.ORACLE_FUNDING_TOKEN }}
          ORACLE_ORDER_BASE_UNITS: ${{ vars.ORACLE_ORDER_BASE_UNITS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_oracle_scanner.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: verification_report.json
          if-no-files-found: warn
      - name: Save scanner state
        if: always()
        run: |
          if [ -f reported_pools.json ] || [ -f watchlist_state.json ] || [ -f signal_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -f reported_pools.json ]; then git add reported_pools.json; fi
            if [ -f watchlist_state.json ]; then git add watchlist_state.json; fi
            if [ -f signal_history.json ]; then git add signal_history.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "Update reported pool IDs [skip ci]"
              # Another commit may arrive while the scanner runs.
              # Rebase the state-only commit rather than force-pushing.
              for attempt in 1 2 3; do
                git fetch origin "$GITHUB_REF_NAME"
                if ! git rebase "origin/$GITHUB_REF_NAME"; then
                  git rebase --abort || true
                  echo "State update conflicted; refusing to overwrite branch changes."
                  exit 1
                fi
                if git push origin "HEAD:$GITHUB_REF_NAME"; then
                  exit 0
                fi
                echo "Concurrent push detected; retrying ($attempt/3)."
                sleep 2
              done
              echo "Could not save reported IDs after three attempts."
              exit 1
            fi
          fi
