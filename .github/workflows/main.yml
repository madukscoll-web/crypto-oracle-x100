name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-oracle-hourly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python source compilation
        id: compile
        run: python -m compileall -q *.py tests
      - name: Run scanner unit tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Check Telegram configuration
        id: telegram_config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYTHON'
          import os
          import sys
          missing = [key for key in ('TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID') if not os.environ.get(key, '').strip()]
          if missing:
              print('::error::Missing required GitHub Secrets: ' + ', '.join(missing))
              sys.exit(1)
          print('Required Telegram secrets are configured (values withheld).')
          PYTHON
      - name: Run scanner
        id: scan
        timeout-minutes: 15
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u crypto_oracle_scanner.py
      - name: Save scanner state
        id: state
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          if [ -f reported_pools.json ] || [ -f watchlist_state.json ] || [ -f signal_history.json ] || [ -f gate_paper_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -f reported_pools.json ]; then git add reported_pools.json; fi
            if [ -f watchlist_state.json ]; then git add watchlist_state.json; fi
            if [ -f signal_history.json ]; then git add signal_history.json; fi
            if [ -f gate_paper_history.json ]; then git add gate_paper_history.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "Update reported pool IDs [skip ci]"
              # Another commit may arrive while the scanner runs.
              # Rebase the state-only commit rather than force-pushing.
              for attempt in 1 2 3; do
                git fetch origin "$GITHUB_REF_NAME"
                if ! git rebase "origin/$GITHUB_REF_NAME"; then
                  git rebase --abort || true
                  echo "State update conflicted; refusing to overwrite branch changes."
                  exit 1
                fi
                if git push origin "HEAD:$GITHUB_REF_NAME"; then
                  exit 0
                fi
                echo "Concurrent push detected; retrying ($attempt/3)."
                sleep 2
              done
              echo "Could not save reported IDs after three attempts."
              exit 1
            fi
          fi
      - name: Notify Telegram when workflow fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED_STAGES: compile=${{ steps.compile.outcome }}, tests=${{ steps.tests.outcome }}, config=${{ steps.telegram_config.outcome }}, scan=${{ steps.scan.outcome }}, state=${{ steps.state.outcome }}
        run: python telegram_notify.py failure
      - name: Retain scan diagnostics and state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            scan_summary.json
            evidence_report.json
            gate_candidate_report.json
            gate_paper_history.json
            reported_pools.json
            watchlist_state.json
            signal_history.json

