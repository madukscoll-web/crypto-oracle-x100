name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-oracle-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate scanner and signal rules
        run: |
          python -m compileall -q crypto_oracle_scanner.py signal_tracker.py evidence_audit.py market_corroboration.py valuation_scenarios.py tests
          python -m unittest discover -s tests -v
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_oracle_scanner.py
      - name: Notify Telegram when scanner fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("Telegram failure alert skipped: bot token or chat ID not configured.")
          else:
              url = "https://api.telegram.org/bot" + token + "/sendMessage"
              message = (
                  "CRYPTO-ORACLE X100: GitHub scanner FAILED. "
                  "No successful scan report should be assumed. "
                  "Inspect: https://github.com/"
                  + os.environ["GH_REPOSITORY"]
                  + "/actions/runs/"
                  + os.environ["GH_RUN_ID"]
              )
              payload = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=payload), timeout=15) as response:
                      result = json.load(response)
                  if not result.get("ok"):
                      print("Telegram did not confirm failure alert delivery.")
              except Exception as exc:
                  print("Telegram failure alert unsuccessful:", type(exc).__name__)
          PY
      - name: Save scanner state
        if: always()
        run: |
          if [ -f reported_pools.json ] || [ -f watchlist_state.json ] || [ -f signal_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -f reported_pools.json ]; then git add reported_pools.json; fi
            if [ -f watchlist_state.json ]; then git add watchlist_state.json; fi
            if [ -f signal_history.json ]; then git add signal_history.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "Update reported pool IDs [skip ci]"
              # Another commit may arrive while the scanner runs.
              # Rebase the state-only commit rather than force-pushing.
              for attempt in 1 2 3; do
                git fetch origin "$GITHUB_REF_NAME"
                if ! git rebase "origin/$GITHUB_REF_NAME"; then
                  git rebase --abort || true
                  echo "State update conflicted; refusing to overwrite branch changes."
                  exit 1
                fi
                if git push origin "HEAD:$GITHUB_REF_NAME"; then
                  exit 0
                fi
                echo "Concurrent push detected; retrying ($attempt/3)."
                sleep 2
              done
              echo "Could not save reported IDs after three attempts."
              exit 1
            fi
          fi
