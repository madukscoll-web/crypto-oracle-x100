
name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check scanner syntax
        run: python -m py_compile crypto_oracle_scanner.py

      - name: Confirm setup
        run: echo "CRYPTO-ORACLE scanner syntax check passed"
