name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-oracle-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_oracle_scanner.py
      - name: Save reported pool IDs
        if: always()
        run: |
          if [ -f reported_pools.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reported_pools.json
            if ! git diff --cached --quiet; then
              git commit -m "Update reported pool IDs [skip ci]"
              # Another commit may arrive while the scanner runs.
              # Rebase the state-only commit rather than force-pushing.
              for attempt in 1 2 3; do
                git fetch origin crypto-oracle-z
                if ! git rebase origin/crypto-oracle-z; then
                  git rebase --abort || true
                  echo "State update conflicted; refusing to overwrite branch changes."
                  exit 1
                fi
                if git push origin HEAD:crypto-oracle-z; then
                  exit 0
                fi
                echo "Concurrent push detected; retrying ($attempt/3)."
                sleep 2
              done
              echo "Could not save reported IDs after three attempts."
              exit 1
            fi
          fi
