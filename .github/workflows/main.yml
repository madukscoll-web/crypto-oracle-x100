name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Run reference integration validation without discovery or state writes
        type: boolean
        default: false
      candidate_scan:
        description: Include bounded live Ethereum, Base and BSC candidate assessment
        type: boolean
        default: false
      scan_limit:
        description: Maximum bounded candidate assessments
        type: choice
        options: ['3', '6', '12']
        default: '3'
      scan_pages:
        description: Discovery pages per network and feed
        type: choice
        options: ['1', '2']
        default: '1'
      send_telegram_test:
        description: Send one deployment diagnostic labelled NO BUY SIGNAL during validation
        type: boolean
        default: false
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-oracle-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate scanner and signal rules
        run: |
          python -m compileall -q *.py tests
          python -m unittest discover -s tests -v
      - name: Validate reference integrations
        if: github.event_name == 'workflow_dispatch' && inputs.validation_only
        env:
          TOKENOMIST_API_KEY: ${{ secrets.TOKENOMIST_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ORACLE_TAKER_ADDRESS: ${{ vars.ORACLE_TAKER_ADDRESS }}
          ORACLE_FUNDING_TOKEN: ${{ vars.ORACLE_FUNDING_TOKEN }}
          ORACLE_ORDER_BASE_UNITS: ${{ vars.ORACLE_ORDER_BASE_UNITS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM_TEST: ${{ inputs.send_telegram_test }}
        run: |
          if [ "$SEND_TELEGRAM_TEST" = "true" ]; then
            python integration_validation.py --send-telegram-test
          else
            python integration_validation.py
          fi
      - name: Scan live candidates without state writes
        if: github.event_name == 'workflow_dispatch' && inputs.validation_only && inputs.candidate_scan
        env:
          TOKENOMIST_API_KEY: ${{ secrets.TOKENOMIST_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ORACLE_TAKER_ADDRESS: ${{ vars.ORACLE_TAKER_ADDRESS }}
          ORACLE_FUNDING_TOKEN: ${{ vars.ORACLE_FUNDING_TOKEN }}
          ORACLE_ORDER_BASE_UNITS: ${{ vars.ORACLE_ORDER_BASE_UNITS }}
          SCAN_LIMIT: ${{ inputs.scan_limit }}
          SCAN_PAGES: ${{ inputs.scan_pages }}
        run: python live_candidate_scan.py --limit "$SCAN_LIMIT" --pages "$SCAN_PAGES" --output live_candidate_scan.json
      - name: Run scanner
        if: github.event_name != 'workflow_dispatch' || !inputs.validation_only
        env:
          TOKENOMIST_API_KEY: ${{ secrets.TOKENOMIST_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ORACLE_TAKER_ADDRESS: ${{ vars.ORACLE_TAKER_ADDRESS }}
          ORACLE_FUNDING_TOKEN: ${{ vars.ORACLE_FUNDING_TOKEN }}
          ORACLE_ORDER_BASE_UNITS: ${{ vars.ORACLE_ORDER_BASE_UNITS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_oracle_scanner.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            verification_report.json
            validation_runtime.json
            live_candidate_scan.json
          if-no-files-found: warn
      - name: Save scanner state
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.validation_only)
        run: |
          if [ -f reported_pools.json ] || [ -f watchlist_state.json ] || [ -f signal_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -f reported_pools.json ]; then git add reported_pools.json; fi
            if [ -f watchlist_state.json ]; then git add watchlist_state.json; fi
            if [ -f signal_history.json ]; then git add signal_history.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "Update reported pool IDs [skip ci]"
              # Another commit may arrive while the scanner runs.
              # Rebase the state-only commit rather than force-pushing.
              for attempt in 1 2 3; do
                git fetch origin "$GITHUB_REF_NAME"
                if ! git rebase "origin/$GITHUB_REF_NAME"; then
                  git rebase --abort || true
                  echo "State update conflicted; refusing to overwrite branch changes."
                  exit 1
                fi
                if git push origin "HEAD:$GITHUB_REF_NAME"; then
                  exit 0
                fi
                echo "Concurrent push detected; retrying ($attempt/3)."
                sleep 2
              done
              echo "Could not save reported IDs after three attempts."
              exit 1
            fi
          fi
