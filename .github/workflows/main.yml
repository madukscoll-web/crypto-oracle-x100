name: CRYPTO-ORACLE X100 Scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
      - stonk_launch_discovery.py
      - multichain_live_research.py
      - tests/test_multichain_live_research.py
      - multichain_research_audit.py
      - crypto_oracle_scanner.py
      - hourly_evidence.py
      - evidence_coverage.py
      - solana_evidence.py
      - verification.py
      - provider_session.py
      - execution_quotes.py
      - kyber_quotes.py
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: crypto-oracle-hourly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python source compilation
        id: compile
        run: python -m compileall -q *.py tests
      - name: Run scanner unit tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Check Telegram configuration
        id: telegram_config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYTHON'
          import os
          import sys
          missing = [key for key in ('TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID') if not os.environ.get(key, '').strip()]
          if missing:
              print('::error::Missing required GitHub Secrets: ' + ', '.join(missing))
              sys.exit(1)
          print('Required Telegram secrets are configured (values withheld).')
          PYTHON
      - name: Run scanner
        id: scan
        timeout-minutes: 15
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u crypto_oracle_scanner.py
      - name: Run bounded multichain discovery audit
        id: multichain
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -u multichain_live_research.py --limit 12 --include-profiles --include-stonk --output multichain_research_report.json
          python - <<'PY'
          import json
          with open('multichain_research_report.json', encoding='utf-8') as source:
              report = json.load(source)
          audit = report['coverage_audit']
          assert audit['scope'] == 'DISCOVERY_ONLY'
          assert audit['selected_total'] == len(report['selected'])
          assert audit['verified_buy_count'] == 0
          assert audit['buy_authorized'] is False
          assert audit['telegram_eligible'] is False
          assert report['orders_allowed'] is False
          print('Read-only multichain coverage:', json.dumps(audit, sort_keys=True))
          PY
      - name: Run read-only StonkFun launch audit
        id: stonk_launches
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import json
          from stonk_launch_discovery import run
          result = run()
          assert result["mode"] == "READ_ONLY_RESEARCH"
          assert result["orders_allowed"] is False
          assert result["buy_authorized"] is False
          assert result["telegram_transmission"] is False
          with open("stonk_launch_report.json", "w", encoding="utf-8") as output:
              json.dump(result, output, indent=2)
          print("StonkFun read-only launches:", result["count"], "invalid:", result["invalid_rows"])
          PY
      - name: Save scanner state
        id: state
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          if [ -f reported_pools.json ] || [ -f watchlist_state.json ] || [ -f signal_history.json ] || [ -f gate_paper_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -f reported_pools.json ]; then git add reported_pools.json; fi
            if [ -f watchlist_state.json ]; then git add watchlist_state.json; fi
            if [ -f signal_history.json ]; then git add signal_history.json; fi
            if [ -f gate_paper_history.json ]; then git add gate_paper_history.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "Update reported pool IDs [skip ci]"
              # Another commit may arrive while the scanner runs.
              # Rebase the state-only commit rather than force-pushing.
              for attempt in 1 2 3; do
                git fetch origin "$GITHUB_REF_NAME"
                if ! git rebase "origin/$GITHUB_REF_NAME"; then
                  git rebase --abort || true
                  echo "State update conflicted; refusing to overwrite branch changes."
                  exit 1
                fi
                if git push origin "HEAD:$GITHUB_REF_NAME"; then
                  exit 0
                fi
                echo "Concurrent push detected; retrying ($attempt/3)."
                sleep 2
              done
              echo "Could not save reported IDs after three attempts."
              exit 1
            fi
          fi
      - name: Notify Telegram on successful scan completion
        if: success() && steps.scan.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py success
      - name: Notify Telegram when workflow fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED_STAGES: compile=${{ steps.compile.outcome }}, tests=${{ steps.tests.outcome }}, config=${{ steps.telegram_config.outcome }}, scan=${{ steps.scan.outcome }}, state=${{ steps.state.outcome }}
        run: python telegram_notify.py failure
      - name: Retain scan diagnostics and state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            stonk_launch_report.json
            multichain_research_report.json
            scan_summary.json
            evidence_report.json
            gate_candidate_report.json
            gate_paper_history.json
            reported_pools.json
            watchlist_state.json
            signal_history.json

