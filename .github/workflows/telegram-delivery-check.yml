name: CRYPTO-ORACLE Telegram Delivery Check

on:
  workflow_dispatch:
  schedule:
    - cron: '35 18 * * *'

permissions:
  contents: read

jobs:
  delivery-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Telegram delivery independently of scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from telegram_notify import send_message
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          url = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          send_message("CRYPTO-ORACLE X100 Telegram delivery check: Bot API confirmed delivery request at " + now + ". This checks notification transport ONLY, not scanner health or BUY eligibility. Run: " + url)
          PY
