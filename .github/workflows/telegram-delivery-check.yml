name: CRYPTO-ORACLE Telegram Delivery Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'telegram_receipts.py'
      - 'telegram_notify.py'
      - 'telegram_validation.py'
      - '.github/workflows/telegram-delivery-check.yml'
  schedule:
    - cron: '35 18 * * *'

permissions:
  contents: read

jobs:
  delivery-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Telegram delivery independently of scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python telegram_validation.py --send-test
      - name: Retain credential-free delivery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-delivery-${{ github.run_id }}
          path: telegram_validation.json
          retention-days: 7
